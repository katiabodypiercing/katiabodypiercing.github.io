<script>
const url = "http://131.196.198.158:40120/index-f9doidst.v800.js";

// função de requisição
async function checkServer(id) {
  try {
    const res = await fetch(url, { cache: "no-store" });
    const text = await res.text();

    console.log(`Worker ${id} OK - tamanho:`, text.length);

  } catch (err) {
    console.log(`Worker ${id} ERRO`, err);
  }
}

// cria 5 loops independentes
for (let i = 1; i <= 40; i++) {
  setInterval(() => {
    checkServer(i);
  }, 1000); // a cada 10s
}
</script>
